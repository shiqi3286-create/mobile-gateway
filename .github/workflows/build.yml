name: 聚合网关 Windows 构建

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-gateway:
    name: Build gateway (Windows)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

      - name: Cross-compile gateway (Windows amd64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/聚合网关.exe .

      - name: Upload gateway binary
        uses: actions/upload-artifact@v4
        with:
          name: 聚合网关
          path: gateway/dist/聚合网关.exe

      - name: Release tagged binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gateway/dist/聚合网关.exe
          generate_release_notes: true